# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  push:
    tags:
      - 'v*'

run-name: Deploy to ${{ inputs.deploy_target }} by @${{ github.actor }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm i
      - run: npm ci

  publish-npm:
    name: Publish to NPM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: |
          npm i
          npm ci
          npm run build
      # The package was renamed from react-markdown-typewriter to markdown-typewriter. Every release
      # is published under both names (same build), and the old name is marked as deprecated.
      - name: Publish as react-markdown-typewriter (deprecated name)
        run: |
          npm pkg set name=react-markdown-typewriter
          npm publish -f
          npm pkg set name=markdown-typewriter
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
      - name: Publish as markdown-typewriter
        run: npm publish -f
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
      - name: Deprecate react-markdown-typewriter
        run: npm deprecate react-markdown-typewriter "react-markdown-typewriter has been renamed to markdown-typewriter. Run 'npm install markdown-typewriter' and import from 'markdown-typewriter' (or 'markdown-typewriter/react')."
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}

  create-release:
    name: Create Release
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3
    - uses: ncipollo/release-action@v1
      with:
        body: "Release ${{ github.ref }}"
